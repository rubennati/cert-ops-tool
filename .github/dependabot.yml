version: 2
updates:
  # Base image in the Dockerfile (tag and digest)
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  # Actions pinned by commit SHA in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # VitePress docs site
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
