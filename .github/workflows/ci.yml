name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # Mondays 05:17 UTC — scan the published image for newly disclosed CVEs
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck -s sh scripts/*.sh config/entrypoint.sh

  build-and-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t cert-ops-tool:ci .

      - name: Smoke test
        run: docker run --rm --entrypoint acme.sh cert-ops-tool:ci --version

      - name: Scan image (fixable CRITICAL/HIGH fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cert-ops-tool:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # A red run here means the published image has fixable CRITICAL/HIGH
  # findings: cut a new release so the image is rebuilt on a patched base.
  scan-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Scan ghcr.io/rubennati/cert-ops-tool:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/rubennati/cert-ops-tool:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
