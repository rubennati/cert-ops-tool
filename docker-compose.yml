services:

  # --------------------------------------------------------
  # CERT-OPS-TOOL
  # Certificate issuing + renewal via acme.sh with DNS-01
  # challenge. For devices without a reverse proxy
  # (NAS, routers, mail servers, etc.).
  # Runs crond in foreground for automatic renewal.
  #
  # Usage:
  #   ./scripts/wizard.sh              Interactive wizard (host-side)
  #   docker compose exec acme-certs /scripts/issue.sh
  #   docker compose exec acme-certs /scripts/renew.sh
  #   docker compose exec acme-certs /scripts/convert-to-pfx.sh
  # --------------------------------------------------------
  acme-certs:
    # --- Identity ---
    image: ghcr.io/rubennati/cert-ops-tool:${APP_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_APP}
    restart: unless-stopped

    # --- Security ---
    security_opt:
      - no-new-privileges:true

    # --- Configuration ---
    environment:
      TZ: ${TZ}
      ACME_EMAIL: ${ACME_EMAIL}
      CERT_DOMAIN: ${CERT_DOMAIN}
      CERT_SAN: ${CERT_SAN}
      CERT_KEYLENGTH: ${CERT_KEYLENGTH}
      ACME_SERVER: ${ACME_SERVER}
    secrets:
      - CF_TOKEN

    # --- Storage ---
    volumes:
      - ./volumes/acme:/acme.sh
      - ./volumes/output:/output

# --------------------------------------------------------
# SECRETS
# --------------------------------------------------------
secrets:
  CF_TOKEN:
    file: ./.secrets/cf_token.txt
